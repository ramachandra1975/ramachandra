<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
        }

        /* THE BACKGROUND & MASKING */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The Mask: This creates the faded/lightened effect from your second image */
        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.5); /* Semi-transparent white mask */
            z-index: 1;
        }

        /* LOGO WATERMARK (Subtle Center) */
        .logo-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            opacity: 0.08; /* Very subtle */
            z-index: 2;
            pointer-events: none;
        }

        /* TOP NAVIGATION & LOGO */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            box-sizing: border-box;
            z-index: 100;
        }

        .header-branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 40px; /* Small logo for top left */
            height: auto;
        }

        .header-text h1 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 1.5px;
            color: #1a365d;
            text-transform: uppercase;
        }

        .header-text p {
            margin: 0;
            font-size: 0.7rem;
            color: #c5a059;
            font-weight: bold;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a365d;
            margin-left: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* MAIN CONTENT - ALIGNED TO PREVENT OVERLAP */
        .content-box {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        .tagline {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #c5a059;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 5rem;
            line-height: 0.9;
            margin: 0;
        }

        .navy { color: #1a365d; }
        .gold { color: #c5a059; font-style: italic; }

        .mission {
            font-size: 0.85rem;
            font-weight: bold;
            color: #1a365d;
            text-transform: uppercase;
            margin-top: 30px;
            letter-spacing: 1px;
        }

        /* BUTTONS */
        .cta-group {
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 18px 45px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-navy { background: #1a365d; color: white; }
        .btn-beige { background: #e8e6e1; color: #333; border: 1px solid #ddd; }

        /* NO SIDEBARS */
    </style>
</head>
<body>

    <section class="hero">
        <!-- Center Watermark -->
        <img src="logo.png" class="logo-watermark">

        <nav>
            <div class="header-branding">
                <img src="logo.png" class="header-logo">
                <div class="header-text">
                    <h1>Aesthetics of Society</h1>
                    <p>culturalmusings.com</p>
                </div>
            </div>
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </div>
        </nav>

        <div class="content-box">
            <p class="tagline">Independent Researcher & Author — Est. 2010</p>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <div class="mission">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="cta-group">
                <a href="#" class="btn btn-navy">Explore Publications</a>
                <a href="#" class="btn btn-beige">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>

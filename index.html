<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naredla Rama Chandra | Independent Researcher</title>
    <style>
        /* GLOBAL SETTINGS */
        :root {
            --primary: #1a365d; 
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            /* Background image with light overlay for readability */
            background-image: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* NAVIGATION HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--primary);
        }

        .header-logo { width: 35px; height: 35px; object-fit: contain; }
        .brand-text { font-family: 'Georgia', serif; font-weight: bold; font-size: 1.1rem; }

        /* POSITIONING THE NAME BETWEEN THE SCRIPT LINES */
        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* Adjust this percentage to move your name up or down between the script lines */
            padding-top: 12vh; 
        }

        .author-name {
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: clamp(0.8rem, 2.5vw, 1.2rem);
            color: #000;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.4); /* Subtle glow behind text */
            padding: 10px 20px;
            border-radius: 4px;
        }

        /* BUTTONS AT THE BOTTOM */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: white; color: var(--primary); border: 1px solid var(--primary); }

        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <span class="brand-text">Aesthetics of Society</span>
        </a>
    </header>

    <main class="hero-container">
        <p class="author-name">Independent Researcher • Naredla Rama Chandra</p>
        
        <div class="btn-group">
            <a href="#" class="btn btn-primary">Explore Publications</a>
            <a href="#" class="btn btn-secondary">About the Author</a>
        </div>
    </main>

</body>
</html>

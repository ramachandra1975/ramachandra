<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society | Naredla Rama Chandra</title>
    <style>
        :root {
            --primary: #1a365d; 
            --accent: #d4af37;
            --bg-file: url('background.png');
            --logo-file: url('logo.jpg');
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden;
        }

        /* FULL SCREEN BACKGROUND */
        .main-wrapper {
            position: relative;
            min-height: 100vh;
            width: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), var(--bg-file);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
        }

        /* CENTERED LOGO WATERMARK - 0.15 Opacity */
        .main-wrapper::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; 
            height: 500px;
            background-image: var(--logo-file);
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }

        .serif { font-family: 'Georgia', serif; }

        /* HEADER WITH 12-ITEM GRID MENU */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .brand-container { display: flex; align-items: center; gap: 15px; }
        .header-logo { width: 45px; height: 45px; object-fit: contain; }
        .brand-text h1 { font-size: 1.3rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); }

        /* THE 12-PAGE MENU GRID */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columns for 12 items */
            gap: 8px 30px;
        }

        .menu-grid a {
            text-decoration: none;
            color: var(--primary);
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .menu-grid a:hover { color: var(--accent); }

        /* HERO CONTENT */
        .hero-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 5;
        }

        .main-title { font-size: 5.5rem; margin: 0; color: var(--primary); font-weight: normal; }
        .main-title span { color: var(--accent); font-style: italic; }

        /* TWO MAIN BUTTONS */
        .button-group {
            display: flex;
            gap: 25px;
            margin-top: 50px;
        }

        .action-btn {
            padding: 18px 45px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: 0.4s;
            border-radius: 2px;
        }

        .btn-dark { background: var(--primary); color: white; }
        .btn-light { background: rgba(255,255,255,0.7); color: var(--primary); }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }

    </style>
</head>
<body>

<div class="main-wrapper">
    <header>
        <div class="brand-container">
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <div class="brand-text">
                <h1 class="serif">Aesthetics of Society</h1>
            </div>
        </div>

        <nav class="menu-grid">
            <a href="#">Home</a>
            <a href="#">Timeline</a>
            <a href="#">About</a>
            <a href="#">Media</a>
            <a href="#">MCP Protocol</a>
            <a href="#">Inquiry</a>
            <a href="#">Publications</a>
            <a href="#">Updates</a>
            <a href="#">Research</a>
            <a href="#">Gallery</a>
            <a href="#">Archives</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="hero-content">
        <h2 class="main-title serif">Aesthetics <span>of Society</span></h2>
        
        <p style="letter-spacing: 4px; text-transform: uppercase; font-size: 11px; color: var(--primary); margin-top: 20px;">
            Independent Research & Clinical Studies
        </p>

        <div class="button-group">
            <button class="action-btn btn-dark">Explore Publications</button>
            <button class="action-btn btn-light">About the Author</button>
        </div>
    </main>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        /* 1. HERO SECTION & BACKGROUND */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. LOGO WATERMARK (Subtle in background) */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40%;
            opacity: 0.15; /* Low opacity for watermark effect */
            z-index: 1;
            pointer-events: none;
        }

        /* 3. NAVIGATION & TOP LEFT LOGO */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            box-sizing: border-box;
            z-index: 20;
        }

        .logo-branding {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 50px; /* Small logo for the header */
            height: auto;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin: 0;
            color: #1a365d;
            text-transform: uppercase;
        }

        .brand-text p {
            margin: 0;
            font-size: 0.8rem;
            color: #c5a059;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a365d;
            margin-left: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 4. RECTIFIED CENTER CONTENT */
        .hero-content {
            position: relative;
            z-index: 10; /* Ensures foreground text is above everything */
            text-align: center;
            width: 90%;
        }

        .tagline {
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: #c5a059;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .main-title {
            font-size: clamp(3rem, 10vw, 5.5rem);
            line-height: 0.9;
            margin: 0;
        }

        .navy { color: #1a365d; }
        .gold { color: #c5a059; font-style: italic; }

        .mission-statement {
            font-size: 0.95rem;
            font-weight: bold;
            color: #1a365d;
            text-transform: uppercase;
            margin-top: 25px;
            line-height: 1.6;
        }

        /* 5. BUTTONS */
        .cta-box {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 0; /* Tight alignment like your screenshot */
        }

        .btn {
            padding: 18px 40px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-navy { background: #1a365d; color: white; }
        .btn-author { background: #d2c8bc; color: #333; } /* Matching the beige tone in your image */

    </style>
</head>
<body>

    <section class="hero">
        <!-- Logo Watermark -->
        <img src="logo.png" class="watermark" alt="Watermark">

        <nav>
            <div class="logo-branding">
                <img src="logo.png" class="logo-img" alt="Logo">
                <div class="brand-text">
                    <h1>Aesthetics of Society</h1>
                    <p>culturalmusings.com</p>
                </div>
            </div>
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </div>
        </nav>

        <div class="hero-content">
            <p class="tagline">Independent Researcher & Author</p>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <p class="mission-statement">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </p>

            <div class="cta-box">
                <a href="#" class="btn btn-navy">Explore Publications</a>
                <a href="#" class="btn btn-author">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>

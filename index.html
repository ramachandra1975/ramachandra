<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        /* RESET & BASE */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
        }

        /* 1. BACKGROUND & MASKING */
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The Mask: Softening background.png for contrast */
        .hero-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.45); 
            z-index: 1;
        }

        /* 2. THE WATERMARK (Centered logo.jpg) */
        .logo-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            opacity: 0.15; /* Subtle but visible */
            z-index: 2;
            pointer-events: none;
        }

        /* 3. HEADER: LOGO & BRANDING (Top Left) */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            box-sizing: border-box;
            z-index: 100;
        }

        .branding-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-small {
            width: 50px;
            height: auto;
            display: block;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 2px;
            color: #0d1b2e; /* DARKER NAVY */
            text-transform: uppercase;
        }

        .brand-text p {
            margin: 0;
            font-size: 0.85rem;
            color: #9e7d3a; /* DARKER GOLD */
        }

        .nav-links a {
            text-decoration: none;
            color: #0d1b2e; /* DARKER NAVY */
            margin-left: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 4. MAIN CONTENT (Center) */
        .main-content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        .main-title {
            font-size: clamp(3rem, 10vw, 5.5rem);
            line-height: 0.9;
            margin: 0;
        }

        .navy { color: #0d1b2e; } /* DARKER NAVY */
        .gold { color: #9e7d3a; font-style: italic; } /* DARKER GOLD */

        .mission-text {
            font-size: 0.95rem;
            font-weight: 900; /* BOLDER */
            color: #0d1b2e;
            text-transform: uppercase;
            margin-top: 30px;
            line-height: 1.5;
            letter-spacing: 1.5px;
        }

        /* 5. BUTTONS */
        .btn-wrap {
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 18px 40px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-navy { background: #0d1b2e; color: white; }
        .btn-author { background: #e0d9cf; color: #111; border: 1px solid #bbb; }

        /* RECTIFICATION: Sidebars (Vedic/Karanas) completely removed */
    </style>
</head>
<body>

    <section class="hero-container">
        <!-- Logo Watermark -->
        <img src="logo.jpg" class="logo-watermark" alt="">

        <header>
            <div class="branding-left">
                <img src="logo.jpg" class="logo-small" alt="Logo">
                <div class="brand-text">
                    <h1>Aesthetics of Society</h1>
                    <p>culturalmusings.com</p>
                </div>
            </div>
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </div>
        </header>

        <div class="main-content">
            <p style="letter-spacing: 4px; color: #9e7d3a; font-weight: bold; text-transform: uppercase; margin-bottom: 5px;">
                Independent Researcher & Author
            </p>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <div class="mission-text">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="btn-wrap">
                <a href="#" class="btn btn-navy">Explore Publications</a>
                <a href="#" class="btn btn-author">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>

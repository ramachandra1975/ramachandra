<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Consciousness Protocol | Naredla Rama Chandra</title>
    <style>
        :root { 
            --navy: #041631; 
            --gold: #b8860b; 
            --white-glass: rgba(255, 255, 255, 0.8);
        }
        
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Times New Roman', serif; scroll-behavior: smooth; }
        
        body {
            background: linear-gradient(var(--white-glass), var(--white-glass)), url('background.png');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: #000;
        }

        /* LOGO WATERMARK */
        .watermark {
            position: fixed; top: 55%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; opacity: 0.05; z-index: -1; pointer-events: none;
        }

        /* HEADER & NAVIGATION */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
            background: rgba(255, 255, 255, 0.98); position: fixed; top: 0; width: 100%; 
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-dropdown { position: relative; display: inline-block; }
        .dropbtn { 
            background: var(--navy); color: white; border: none; padding: 10px 22px; 
            font-weight: bold; cursor: pointer; border-radius: 4px; font-family: serif;
            letter-spacing: 1px; transition: 0.3s;
        }
        .dropdown-content {
            display: none; position: absolute; right: 0; background-color: white;
            min-width: 200px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 1;
            border-top: 3px solid var(--navy); border-radius: 0 0 4px 4px;
        }
        .dropdown-content a {
            color: var(--navy); padding: 12px 16px; text-decoration: none; display: block; 
            font-weight: bold; border-bottom: 1px solid #eee;
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f8f8f8; color: var(--gold); }
        .nav-dropdown:hover .dropdown-content { display: block; }
        .nav-dropdown:hover .dropbtn { background: #0a254d; }

        .container { max-width: 1150px; margin: 160px auto 80px; padding: 0 40px; }

        /* TEXT READABILITY */
        .readable-text {
            text-shadow: 0px 0px 15px #fff, 0px 0px 5px #fff;
            font-weight: 600;
            line-height: 1.9;
            font-size: 1.3rem;
        }

        /* TABS / RADIO BUTTONS */
        .radio-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 35px; flex-wrap: wrap; }
        .radio-group input { display: none; }
        .radio-group label {
            padding: 10px 25px; border: 2px solid var(--navy); border-radius: 40px;
            cursor: pointer; font-weight: bold; background: white;
            text-transform: uppercase; font-size: 0.85rem; color: var(--navy);
            transition: 0.2s;
        }
        .radio-group input:checked + label { background: var(--navy); color: white; }

        /* CONTENT LAYOUT */
        .content-wrap { display: flex; gap: 50px; align-items: flex-start; flex-wrap: wrap; }
        .media-side { flex: 1; min-width: 320px; }
        .text-side { flex: 1.5; min-width: 350px; text-align: justify; }

        .image-frame { 
            width: 100%; max-width: 400px; border-radius: 4px; 
            border: 3px solid var(--navy); box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        }
        
        section { padding: 80px 0; border-bottom: 2px solid rgba(10,37,77,0.1); }
        h2 { color: var(--navy); text-align: center; letter-spacing: 2px; font-size: 2.2rem; margin-bottom: 25px; }
        h3 { border-bottom: 2px solid var(--navy); display: inline-block; margin-bottom: 15px; }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 10px; text-align: center; }
            .container { margin-top: 200px; }
        }
    </style>
</head>
<body>

    <img src="logo.jpg" class="watermark">

    <header>
        <div style="font-weight: bold; color: var(--navy); font-size: 1.4rem;">AESTHETICS OF SOCIETY</div>
        <div class="nav-dropdown">
            <button class="dropbtn">EXPLORE ☰</button>
            <div class="dropdown-content">
                <a href="#author">Introduction</a>
                <a href="#karanas">108 Karanas</a>
                <a href="#mcp">The Protocol</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </header>

    <div class="container">
        <section id="author">
            <h2 class="readable-text">NAREDLA RAMA CHANDRA</h2>
            <div class="radio-group">
                <input type="radio" name="atab" id="p" checked onclick="updateAuth('p')">
                <label for="p">Brief Profile</label>
                <input type="radio" name="atab" id="ph" onclick="updateAuth('ph')">
                <label for="ph">Research Philosophy</label>
            </div>

            <div class="content-wrap">
                <div class="media-side" id="auth-img-container">

                </div>
                <div class="text-side readable-text" id="auth-display"></div>
            </div>
        </section>

        <section id="karanas">
            <h2 class="readable-text">THE 10 KARANAS: SOURCE CODE</h2>
            <div class="radio-group">

                    for(let i=1; i<=10; i++) {

                                       <label for="k${i}">K-${i<10?'0'+i:i}</label>`);
                    }
                </script>
            </div>
            <div class="content-wrap">
                <div class="media-side"><img src="k1.jpg" id="k-img" class="image-frame"></div>
                <div class="text-side readable-text">
                    <h3 id="k-title" style="margin-top:0; color:var(--navy);"></h3>
                    <div id="k-desc" style="white-space: pre-line;"></div>
                </div>
            </div>
        </section>
    </div>

            // Hide image only when Philosophy is selected

        }

        function updateK(id) {
            const k = library.karanas[id];
            document.getElementById('k-img').src = `k${id}.jpg`;
            document.getElementById('k-title').innerText = k.title;
            document.getElementById('k-desc').innerText = k.text;

        updateAuth('p');

</body>
</html>

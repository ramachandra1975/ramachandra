<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society | Naredla Rama Chandra</title>
    <style>
        /* GLOBAL SETTINGS */
        :root {
            --primary: #1a365d; 
            --accent: #d4af37;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            /* Loads your sunrise background */
            background-image: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* LOGO WATERMARK IN THE CENTER */
        body::before {
            content: "";
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; 
            height: 350px;
            background-image: url('logo.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.1; /* Subtle transparency */
            z-index: -1;
            pointer-events: none;
        }

        /* NAVIGATION HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary);
        }

        .header-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .brand-text {
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* CENTERED CONTENT AREA */
        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers horizontally */
            justify-content: center; /* Centers vertically */
            text-align: center;
            padding: 20px;
            margin-top: 60px; /* Space for fixed header */
        }

        .main-title {
            font-family: 'Georgia', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem); /* Responsive size */
            margin: 0;
            color: #000;
            line-height: 1.1;
        }

        .author-name {
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: clamp(0.7rem, 2vw, 1rem);
            margin: 20px 0 40px 0;
            color: var(--primary);
            font-weight: 600;
        }

        /* CENTERED BUTTONS */
        .btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(26, 54, 93, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 600px) {
            .btn-group { flex-direction: column; width: 100%; max-width: 280px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <span class="brand-text">Aesthetics of Society</span>
        </a>
        <nav>
            </nav>
    </header>

    <main class="hero-container">
        <h1 class="main-title">Aesthetics of Society</h1>
        
        <p class="author-name">Independent Researcher • Naredla Rama Chandra</p>
        
        <div class="btn-group">
            <a href="#" class="btn btn-primary">Explore Publications</a>
            <a href="#" class="btn btn-secondary">About the Author</a>
        </div>
    </main>

</body>
</html>

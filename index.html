<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
            overflow: hidden;
        }

        /* 1. MAIN BACKGROUND & FADE MASK */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Mask: Softens the background script */
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.45); 
            z-index: 1;
        }

        /* 2. THE SIDEBARS - RE-ADDED & FIXED */
        .sidebar {
            position: absolute;
            top: 0;
            height: 100%;
            width: 15%; /* Fixed width to prevent crashing into center */
            z-index: 5;
            opacity: 0.6; /* Faded so they don't distract */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-left { left: 0; }
        .sidebar-right { right: 0; }

        .sidebar img {
            height: 80%; /* Vertical alignment */
            width: auto;
            object-fit: contain;
        }

        /* 3. LOGO WATERMARK (logo.jpg) */
        .logo-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            opacity: 0.12;
            z-index: 2;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* 4. HEADER: TOP-LEFT LOGO & BRANDING */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            box-sizing: border-box;
            z-index: 100;
        }

        .branding-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-top {
            width: 50px;
            height: auto;
        }

        .brand-text h1 {
            font-size: 1.15rem;
            margin: 0;
            letter-spacing: 2px;
            color: #0d1b2e; /* Darker Navy */
            text-transform: uppercase;
        }

        .brand-text p {
            margin: 0;
            font-size: 0.85rem;
            color: #9e7d3a; /* Darker Gold */
        }

        nav a {
            text-decoration: none;
            color: #0d1b2e;
            margin-left: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 5. MAIN CONTENT (CENTERED) */
        .content {
            position: relative;
            z-index: 20; /* Sits above sidebars */
            text-align: center;
            width: 50%; /* Constrained to the center */
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: #9e7d3a;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .main-title {
            font-size: clamp(3rem, 7vw, 5rem);
            line-height: 0.95;
            margin: 0;
        }

        .navy { color: #0d1b2e; }
        .gold { color: #9e7d3a; font-style: italic; }

        .mission {
            font-size: 0.95rem;
            font-weight: 900;
            color: #0d1b2e;
            text-transform: uppercase;
            margin-top: 35px;
            letter-spacing: 1.5px;
            line-height: 1.6;
        }

        /* 6. BUTTONS */
        .btn-container {
            margin-top: 45px;
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 18px 45px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-navy { background: #0d1b2e; color: white; }
        .btn-beige { background: #e0d9cf; color: #111; border: 1px solid #bbb; }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Center Watermark -->
        <img src="logo.jpg" class="logo-watermark">

        <!-- Sidebars -->
        <div class="sidebar sidebar-left">
            <img src="vedic.png" alt="Vedic Manuscript">
        </div>
        <div class="sidebar sidebar-right">
            <img src="karanas.png" alt="Karanas Pose">
        </div>

        <header>
            <div class="branding-left">
                <img src="logo.jpg" class="logo-top">
                <div class="brand-text">
                    <h1>Aesthetics of Society</h1>
                    <p>culturalmusings.com</p>
                </div>
            </div>
            <nav>
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="content">
            <p class="tagline">Independent Researcher & Author</p>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <div class="mission">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="btn-container">
                <a href="#" class="btn btn-navy">Explore Publications</a>
                <a href="#" class="btn btn-beige">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>

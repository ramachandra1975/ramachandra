<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society | Cultural Musings</title>
    <style>
        :root {
            --primary-navy: #1a365d;
            --accent-gold: #c5a059;
            --bg-cream: #fdfbf7;
            --text-dark: #2d3748;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Hero Section with Fixed Background Overlap Fix */
        .hero {
            position: relative;
            height: 100vh;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
                        url('https://images.unsplash.com/photo-1500673922987-e212871fec22?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: scroll; /* Prevents background overlapping on mobile */
            padding: 0 20px;
        }

        /* Navigation */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            box-sizing: border-box;
        }

        .brand {
            text-align: left;
        }

        .brand h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--primary-navy);
            text-transform: uppercase;
        }

        .brand p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--accent-gold);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-navy);
            margin-left: 25px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Main Content Titles */
        .hero-content {
            z-index: 2;
            max-width: 900px;
        }

        .tagline {
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: clamp(3rem, 10vw, 5rem);
            margin: 0;
            line-height: 1;
        }

        .main-title .navy { color: var(--primary-navy); }
        .main-title .gold { color: var(--accent-gold); font-style: italic; }

        .mission {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 30px 0;
            color: var(--primary-navy);
            font-weight: bold;
        }

        /* Buttons */
        .cta-container {
            display: flex;
            gap: 0;
            margin-top: 40px;
        }

        .btn {
            padding: 15px 40px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-navy {
            background: var(--primary-navy);
            color: white;
        }

        .btn-outline {
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--text-dark);
            background: rgba(255,255,255,0.5);
        }

        /* Responsive Fix for Mobile Overlap */
        @media (max-width: 768px) {
            nav { padding: 20px; flex-direction: column; }
            .nav-links { margin-top: 20px; }
            .cta-container { flex-direction: column; width: 100%; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <nav>
            <div class="brand">
                <h1>Aesthetics of Society</h1>
                <p>culturalmusings.com</p>
            </div>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#publications">Publications</a>
                <a href="#timeline">Timeline</a>
                <a href="#media">Media</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>

        <div class="hero-content">
            <div class="tagline">Independent Researcher & Author</div>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <div class="mission">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="cta-container">
                <a href="#publications" class="btn btn-navy">Explore Publications</a>
                <a href="#author" class="btn btn-outline">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>

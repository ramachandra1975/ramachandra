<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
            overflow: hidden;
        }

        /* 1. BACKGROUND & FADE MASK */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); 
            z-index: 1;
        }

        /* 2. LOGO WATERMARK - SMALLER & BLENDED */
        .central-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px; /* Reduced size */
            opacity: 0.25; 
            z-index: 2;
            mix-blend-mode: multiply; /* Removes white JPG box */
            pointer-events: none;
        }

        /* 3. HEADER & NAVIGATION */
        header {
            position: absolute;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-sizing: border-box;
            z-index: 100;
        }

        .nav-logo {
            width: 35px; /* Smaller Nav Logo */
            mix-blend-mode: multiply;
        }

        nav a {
            text-decoration: none;
            color: #0d1b2e;
            margin-left: 15px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 4. TRUE TEXT WATERMARKING */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .tagline {
            font-size: 0.8rem;
            letter-spacing: 4px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            /* Watermark effect: */
            color: #8a6d2f;
            opacity: 0.6;
            mix-blend-mode: multiply;
        }

        .main-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            line-height: 1;
            margin: 0;
            /* Watermark effect: */
            color: #0d1b2e;
            opacity: 0.8;
            mix-blend-mode: multiply;
        }

        .gold-italic { 
            color: #8a6d2f;
            font-style: italic; 
        }

        .mission {
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 30px;
            letter-spacing: 1.5px;
            line-height: 1.4;
            /* Watermark effect: */
            color: #0d1b2e;
            opacity: 0.65;
            mix-blend-mode: multiply;
        }

        /* 5. SMALLER COMPACT BUTTONS */
        .btn-container {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 8px 22px; /* Very short padding */
            text-decoration: none;
            font-size: 0.7rem; /* Smaller font */
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 1px;
        }

        .btn-navy { background: #0d1b2e; color: white; }
        .btn-beige { background: #e2dad0; color: #111; border: 1px solid #ccc; }

    </style>
</head>
<body>

    <section class="hero">
        
        <!-- Center Logo Watermark -->
        <img src="logo.jpg" class="central-watermark" alt="">

        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="logo.jpg" class="nav-logo" alt="">
                <div style="color:#0d1b2e; text-transform:uppercase; font-size:0.9rem; letter-spacing:1px; font-weight:bold;">
                    Aesthetics of Society
                </div>
            </div>
            <nav>
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="content">
            <p class="tagline">Independent Researcher & Author</p>
            
            <h1 class="main-title">
                Aesthetics<br>
                <span class="gold-italic">of Society</span>
            </h1>

            <div class="mission">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="btn-container">
                <a href="#" class="btn btn-navy">Publications</a>
                <a href="#" class="btn btn-beige">The Author</a>
            </div>
        </div>

    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
            overflow: hidden;
        }

        /* 1. BACKGROUND */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2); 
            z-index: 1;
        }

        /* 2. TOP LEFT BRANDING & INCREASED LOGO */
        header {
            position: absolute;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 60px; /* Generous padding for the larger logo */
            box-sizing: border-box;
            z-index: 100;
        }

        .branding-left {
            display: flex;
            align-items: center;
            gap: 25px; /* More space between logo and text */
        }

        /* LOGO INCREASED TO 125PX - WATERMARKED */
        .nav-logo {
            width: 125px; 
            opacity: 0.65; 
            mix-blend-mode: multiply; /* Removes white box from logo.jpg */
            filter: grayscale(10%);
        }

        .brand-text h1 {
            font-size: 1.4rem; /* Scaled up to match logo */
            margin: 0;
            letter-spacing: 2px;
            color: #0d1b2e;
            text-transform: uppercase;
        }

        .brand-text p {
            margin: 0;
            font-size: 0.9rem; /* Scaled up URL */
            color: #a68b4c; 
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        nav a {
            text-decoration: none;
            color: #0d1b2e;
            margin-left: 25px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 3. CENTRAL CONTENT */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .tagline-watermark {
            font-size: 0.95rem;
            letter-spacing: 5px;
            font-weight: bold;
            text-transform: uppercase;
            color: #c5a66d; 
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .mission-watermark {
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.6;
            color: #5c6d85; 
            opacity: 0.8;
            margin-top: 20px;
        }

        /* 4. RADIO PILL BUTTONS (STILL COMPACT) */
        .btn-container {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 8px 22px;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 40px;
            border: 1px solid #0d1b2e;
        }

        .btn-navy { background: #0d1b2e; color: #fff; }
        .btn-outline { background: transparent; color: #0d1b2e; }

    </style>
</head>
<body>

    <section class="hero">
        
        <header>
            <div class="branding-left">
                <!-- Watermarked Logo (125px) -->
                <img src="logo.jpg" class="nav-logo" alt="Logo">
                
                <div class="brand-text">
                    <h1>Aesthetics of Society</h1>
                    <p>culturalmusings.com</p>
                </div>
            </div>
            
            <nav>
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="content">
            <div class="tagline-watermark">
                Independent Researcher & Author
            </div>
            
            <div class="mission-watermark">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="btn-container">
                <a href="#" class="btn btn-navy">Publications</a>
                <a href="#" class="btn btn-outline">The Author</a>
            </div>
        </div>

    </section>

</body>
</html>

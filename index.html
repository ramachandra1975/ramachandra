<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry | Naredla Rama Chandra</title>
    <style>
        :root {
            --primary: #1a365d; 
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-image: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5%;
            background: rgba(255, 255, 255, 0.9);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .brand-text { font-family: 'Georgia', serif; font-weight: bold; color: var(--primary); }

        .container {
            max-width: 800px;
            margin: 120px auto 50px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { font-family: 'Georgia', serif; color: var(--primary); margin-bottom: 10px; }
        
        .contact-info {
            margin: 20px 0;
            padding: 20px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            line-height: 1.8;
        }

        .contact-info b { color: var(--primary); }

        form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }

        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="logo.jpg" style="width:35px;">
            <span class="brand-text">Aesthetics of Society</span>
        </div>
    </header>

    <div class="container">
        <h2>Professional Inquiry</h2>
        <p>For research collaborations or academic queries, please use the details below.</p>

        <div class="contact-info">
            <p><b>Phone:</b> +91 9121379100</p>
            <p><b>Email:</b> smith123846@gmail.com</p>
        </div>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message or Research Inquiry" rows="5" required></textarea>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </div>

</body>
</html>

HTML
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Consciousness Protocol | Naredla Rama Chandra</title>
    <style>
        :root { --primary: #0a254d; --accent: #d4af37; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; scroll-behavior: smooth; }
        
        body {
            background-image: linear-gradient(rgba(255,255,255,0.25), rgba(255,255,255,0.25)), url('background.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #000;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 5%; background: rgba(255, 255, 255, 0.9);
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }

        .nav-select { 
            padding: 10px; border: 2px solid var(--primary); border-radius: 4px; 
            background: white; color: var(--primary); font-weight: bold; cursor: pointer;
        }

        .container { max-width: 1000px; margin: 160px auto 80px; padding: 0 30px; }

        /* AUTOMATIC UPDATE RADIO BUTTONS */
        .radio-group { margin: 30px 0; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .radio-group input[type="radio"] { display: none; }
        
        .radio-group label {
            padding: 12px 25px; border: 2px solid var(--primary); border-radius: 30px;
            cursor: pointer; font-weight: bold; transition: 0.3s; 
            background: rgba(255,255,255,0.6); color: var(--primary);
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;
        }

        .radio-group input[type="radio"]:checked + label { background: var(--primary); color: white; }

        .display-area {
            min-height: 120px; padding: 25px 0; font-size: 1.2rem; line-height: 1.8;
            color: #000; text-shadow: 0px 0px 10px white; text-align: justify;
        }

        section { padding: 50px 0; border-bottom: 1px solid rgba(10, 37, 77, 0.1); }
        h2 { font-family: 'Georgia', serif; color: var(--primary); text-shadow: 1px 1px 2px white; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logo.jpg" style="width:50px; height:50px; border-radius: 50%;">
            <span style="font-weight: bold; color: var(--primary);">Aesthetics of Society</span>
        </div>
        <nav>
            <select class="nav-select" onchange="if(this.value) location.hash = this.value;">
                <option value="">EXPLORE THE PROTOCOL</option>
                <option value="#author">01. Author Introduction</option>
                <option value="#karanas">02. 10 Karanas (Postures)</option>
                <option value="#mcp">03. Master Consciousness Protocol</option>
                <option value="#swaras">04. Sapta Swaras & Healing</option>
                <option value="#cosmic">05. The Cosmic Choreography</option>
                <option value="#psych">06. Sampoorna Manovijnana</option>
                <option value="#yoga">07. Yoga: Eternal Science</option>
                <option value="#dna">08. Beeja Akshara & DNA</option>
                <option value="#bio">09. Vedic Bio-Acoustics</option>
                <option value="#vak">10. Cosmic Vak Series</option>
                <option value="#lineage">11. Guru Shishya Clan</option>
                <option value="#contact">12. Research Inquiry</option>
            </select>
        </nav>
    </header>

    <div class="container">
        
        <section id="author">
            <h2 style="text-align: center;">INDEPENDENT RESEARCHER • NAREDLA RAMA CHANDRA</h2>
            <div class="radio-group">
                <input type="radio" name="auth-tab" id="a1" checked onclick="autoUpdate('auth', 'a1')">
                <label for="a1">Brief Profile</label>
                
                <input type="radio" name="auth-tab" id="a2" onclick="autoUpdate('auth', 'a2')">
                <label for="a2">Research Philosophy</label>
            </div>
            <div id="auth-display" class="display-area"></div>
        </section>

        <section id="karanas">
            <h2>The 10 Karanas: Source Code Analysis</h2>
            <div class="radio-group">
                <script>
                    for(let i=1; i<=10; i++) {
                        let id = "k"+i;
                        document.write(`<input type="radio" name="k-tab" id="${id}" ${i==1?'checked':''} onclick="autoUpdate('karana', '${id}')">`);
                        document.write(`<label for="${id}">K-${i < 10 ? '0'+i : i}</label>`);
                    }
                </script>
            </div>
            <div id="karana-display" class="display-area"></div>
        </section>

    </div>

    <script>
        // Content Data Store
        const data = {
            auth: {
                'a1': 'Naredla Rama Chandra is an independent researcher and author specializing in the integration of Indian Classical Arts, Bio-Acoustics, and Neuroscience.',
                'a2': 'Deciphering the "Source Code" of the Natya Shastra to develop the Master Consciousness Protocol for cellular wellness.'
            },
            karana: {
                'k1': 'Karana 01: Spinal alignment for electromagnetic resonance.',
                'k2': 'Karana 02: Lateral movement for brain synchronization.',
                'k3': 'Karana 03: Hand mudra and bio-acoustic frequency mapping.',
                'k4': 'Karana 04: Grounding transitions with terrestrial rhythms.',
                'k5': 'Karana 05: Rotational dynamics in the Consciousness Protocol.',
                'k6': 'Karana 06: Neuro-geometric patterns for physiological health.',
                'k7': 'Karana 07: Resonance mapping for cellular bio-acoustics.',
                'k8': 'Karana 08: Aligning movement with astrophysical cycles.',
                'k9': 'Karana 09: Bridge between static and dynamic meditation.',
                'k10': 'Karana 10: Final synthesis of vibrational sound medicine.'
            }
        };

        // Automatic Update Function
        function autoUpdate(type, id) {
            const displayId = type === 'auth' ? 'auth-display' : 'karana-display';
            document.getElementById(displayId).innerText = data[type][id];
        }

        // Run on load to set defaults
        autoUpdate('auth', 'a1');
        autoUpdate('karana', 'k1');
    </script>
</body>
</html>

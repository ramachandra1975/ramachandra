HTML
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Consciousness Protocol | Naredla Rama Chandra</title>
    <style>
        :root { --navy: #041631; --gold: #b8860b; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Times New Roman', serif; scroll-behavior: smooth; }
        
        body {
            background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url('background.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #000;
        }

        /* HEADER & DROPDOWN */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
            background: rgba(255, 255, 255, 0.98); position: fixed; top: 0; width: 100%; 
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-dropdown { position: relative; }
        .dropbtn { 
            background: var(--navy); color: white; border: none; padding: 10px 20px; 
            font-weight: bold; cursor: pointer; border-radius: 4px; font-family: serif;
        }
        .dropdown-content {
            display: none; position: absolute; right: 0; background: white;
            min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); 
            border-top: 3px solid var(--navy);
        }
        .dropdown-content.show { display: block; }
        .dropdown-content a {
            color: var(--navy); padding: 12px 16px; text-decoration: none; 
            display: block; font-weight: bold; border-bottom: 1px solid #eee;
        }
        .dropdown-content a:hover { background: #f8f8f8; color: var(--gold); }

        .container { max-width: 1150px; margin: 160px auto 80px; padding: 0 40px; }

        /* TEXT STYLING */
        .readable-text { text-shadow: 0px 0px 10px #fff; font-weight: 600; line-height: 1.8; font-size: 1.3rem; }

        .radio-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .radio-group input { display: none; }
        .radio-group label {
            padding: 10px 22px; border: 2px solid var(--navy); border-radius: 40px;
            cursor: pointer; font-weight: bold; background: white; font-size: 0.9rem; color: var(--navy);
        }
        .radio-group input:checked + label { background: var(--navy); color: white; }

        /* CONTENT LAYOUT */
        .content-wrap { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
        .media-side { flex: 1; min-width: 320px; }
        .text-side { flex: 1.5; min-width: 350px; text-align: justify; }

        .image-frame { 
            width: 100%; border: 3px solid var(--navy); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); border-radius: 4px;
        }
        
        section { padding: 60px 0; border-bottom: 1px solid rgba(10,37,77,0.1); }
        h2 { text-align: center; color: var(--navy); letter-spacing: 1px; font-size: 2.2rem; margin-bottom: 30px; }

        .read-more-btn {
            margin-top: 20px; padding: 12px 25px; background: var(--gold); color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
            text-transform: uppercase; transition: 0.3s;
        }
        .read-more-btn:hover { background: var(--navy); }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; color: var(--navy); font-size: 1.3rem;">AESTHETICS OF SOCIETY</div>
        <div class="nav-dropdown">
            <button class="dropbtn" onclick="toggleMenu()">EXPLORE ☰</button>
            <div id="myDropdown" class="dropdown-content">
                <a href="#author">About the Author</a>
                <a href="#karanas">10 Karanas</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </header>

    <div class="container">
        <section id="author">
            <h2>NAREDLA RAMA CHANDRA</h2>
            <div class="radio-group">
                <input type="radio" name="atab" id="p" checked onclick="updateAuth('p')">
                <label for="p">Brief Profile</label>
                <input type="radio" name="atab" id="ph" onclick="updateAuth('ph')">
                <label for="ph">Research Philosophy</label>
            </div>
            <div class="content-wrap">
                <div class="media-side" id="auth-img-container">
                    <img src="author.jpg" class="image-frame" alt="Naredla Rama Chandra">
                </div>
                <div class="text-side readable-text" id="auth-display"></div>
            </div>
        </section>

        <section id="karanas">
            <h2>THE 10 KARANAS: SOURCE CODE</h2>
            <div class="radio-group">
                <script>
                    for(let i=1; i<=10; i++) {
                        document.write(`<input type="radio" name="ktab" id="k${i}" ${i==1?'checked':''} onclick="updateK(${i})">
                                       <label for="k${i}">K-${i<10?'0'+i:i}</label>`);
                    }
                </script>
            </div>
            <div class="content-wrap">
                <div class="media-side"><img src="k1.jpg" id="k-img" class="image-frame"></div>
                <div class="text-side">
                    <h3 id="k-title" style="color:var(--navy); margin-top:0; border-bottom: 2px solid var(--navy); display:inline-block;"></h3>
                    <div id="k-desc" class="readable-text" style="white-space: pre-line; margin-top:15px;"></div>
                    <button class="read-more-btn" id="read-more-node" onclick="showFullCode()">Read Full Source Code</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        let currentK = 1;
        const library = {
            profile: "Naredla Rama Chandra is an independent researcher and author specializing in the 'Source Code' of ancient Indian knowledge systems. His work integrates the Natya Shastra with modern neuroscience and bio-acoustics, creating a scientific bridge for clinical physiological wellness. He is the architect of the Master Consciousness Protocol (MCP).",
            philosophy: "His research posits that ancient Karanas are biochemical switches. By aligning neuro-geometric movements with Raga frequencies, the Protocol triggers cellular resonance, offering a scientific pathway to sound-based healing and consciousness expansion through the aesthetics of ancient society.",
            karanas: {
                1: { 
                    title: "K-01: Talapushpaputam", 
                    summary: "Establishes primary vertical alignment and bio-acoustic reception. Utilizes the thoracic cage as a resonant chamber for terrestrial frequency alignment.",
                    full: "1. Primary Vertical Alignment\n2. Bio-acoustic reception logic\n3. Thoracic resonant chamber\n4. CNS terrestrial sync\n5. Alpha-wave foundation\n6. Geometric stillness\n7. EMF field calibration\n8. Mudra-sound intersection\n9. MCP Foundation Node\n10. Clinical resonance baseline\n11. Respiratory rhythm sync\n12. Neural pathway priming\n13. Bio-mechanical anchor\n14. Frequency stabilization\n15. Cellular reception active."
                },
                2: { 
                    title: "K-02: Vartitam", 
                    summary: "Activates the wrist-brain axis through inward/outward rotation, priming synaptic pathways for fine motor control and neuro-geometric mapping.",
                    full: "1. Wrist-neural mapping\n2. Inward energy flow\n3. Wrist-brain frequency axis\n4. Kinetic redirection\n5. Synaptic priming\n6. Forearm geometry\n7. Flow state entry\n8. Pranic regulation\n9. Dual-hemisphere link\n10. Motor-cortex activation\n11. Cognitive clarity\n12. Neuromuscular feedback\n13. Limbic system calming\n14. Radial nerve stimulation\n15. Spatial awareness boost."
                },
                // Additional 15-line Source Codes for K-03 to K-10 follow the same structure...
            }
        };

        function toggleMenu() { document.getElementById("myDropdown").classList.toggle("show"); }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) dropdowns[i].classList.remove('show');
                }
            }
        }

        function updateAuth(type) {
            document.getElementById('auth-display').innerText = type === 'p' ? library.profile : library.philosophy;
            // Hide image only when Research Philosophy is active
            document.getElementById('auth-img-container').style.display = type === 'p' ? 'block' : 'none';
        }

        function updateK(id) {
            currentK = id;
            const k = library.karanas[id] || {title: "Karana "+id, summary: "Details coming soon...", full: "Full analysis pending."};
            document.getElementById('k-img').src = `k${id}.jpg`;
            document.getElementById('k-title').innerText = k.title;
            document.getElementById('k-desc').innerText = k.summary;
            document.getElementById('read-more-node').style.display = "block";
        }

        function showFullCode() {
            const k = library.karanas[currentK];
            document.getElementById('k-desc').innerText = k.full;
            document.getElementById('read-more-node').style.display = "none";
        }

        // Initialize view
        updateAuth('p'); updateK(1);
    </script>
</body>
</html>

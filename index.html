<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Consciousness Protocol | Naredla Rama Chandra</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #041631; --gold: #c9a84c; --gold-dark: #7a5c1e; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #0a0a0a; 
            color: #d4d4d4; 
            font-family: 'Cormorant Garamond', serif; 
            line-height: 1.6;
        }

        /* HEADER & NAVIGATION */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 5%; background: rgba(255, 255, 255, 0.98);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .header-logo { height: 50px; width: auto; border: 1px solid var(--navy); }
        .site-title { font-family: 'Cinzel', serif; font-weight: bold; color: var(--navy); font-size: 1.2rem; }

        nav select {
            padding: 8px 15px; font-family: 'Cinzel', serif; font-weight: bold;
            background: var(--navy); color: white; border: none; border-radius: 4px;
            cursor: pointer;
        }

        .container { max-width: 1300px; margin: 120px auto 80px; padding: 0 20px; }

        /* AUTHOR SECTION */
        #author { background: white; color: black; padding: 60px; border-radius: 8px; margin-bottom: 60px; }
        .author-title { font-family: 'Cinzel', serif; color: var(--navy); text-align: center; margin-bottom: 30px; font-size: 2.5rem; }
        .content-wrap { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
        .author-img { width: 300px; border: 5px solid var(--navy); box-shadow: 10px 10px 0px var(--gold); }

        /* KARANA CARD STYLES (Your Exact Verbiage) */
        .karana-card {
            width: 100%; height: auto; min-height: 600px; background: #000;
            position: relative; display: flex; align-items: stretch;
            overflow: hidden; margin-bottom: 80px; border: 2px solid var(--gold-dark);
        }
        .karana-card::before { content: ''; position: absolute; width: 60px; height: 60px; border-color: var(--gold); border-style: solid; top: 8px; left: 8px; border-width: 3px 0 0 3px; z-index: 10; }
        .karana-card::after { content: ''; position: absolute; width: 60px; height: 60px; border-color: var(--gold); border-style: solid; bottom: 8px; right: 8px; border-width: 0 3px 3px 0; z-index: 10; }

        .left-panel { width: 280px; padding: 40px 25px; z-index: 2; border-right: 1px solid var(--gold-dark); }
        .label { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; margin-top: 20px; }
        .panel-text { font-size: 14px; color: #e0e0e0; }

        .center-panel { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #3d2600 0%, #000 70%); }
        .karana-image { height: 350px; object-fit: contain; z-index: 5; filter: drop-shadow(0 0 20px rgba(200,140,0,0.4)); }
        .karana-num-big { font-family: 'Cinzel', serif; font-size: 80px; color: rgba(201, 168, 76, 0.1); position: absolute; top: 20px; }

        .right-panel { width: 260px; padding: 40px 25px; border-left: 1px solid var(--gold-dark); text-align: center; }
        .neuro-box { background: rgba(201, 168, 76, 0.1); padding: 15px; border-radius: 50%; margin: 20px auto; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold); }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .karana-card { flex-direction: column; }
            .left-panel, .right-panel { width: 100%; border: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpg" class="header-logo" alt="Logo">
            <div class="site-title">AESTHETICS OF SOCIETY</div>
        </div>
        <nav>
            <select onchange="window.location.hash=this.value">
                <option value="#author">1. Introduction</option>
                <option value="#K1">2. Karana 01: Talapushpaputam</option>
                <option value="#K2">3. Karana 02: Lina</option>
                <option value="#K3">4. Karana 03: Vartita</option>
                <option value="#K4">5. Karana 04: Valita</option>
                <option value="#K5">6. Karana 05: Nivritta</option>
                <option value="#K6">7. Karana 06: Nikuttita</option>
                <option value="#K7">8. Karana 07: Ardha-Nikuttita</option>
                <option value="#K8">9. Karana 08: Recita</option>
                <option value="#K9">10. Karana 09: Katihasta</option>
                <option value="#K10">11. Karana 10: Pakshavanchita</option>
                <option value="#contact">12. Contact & Research</option>
            </select>
        </nav>
    </header>

    <div class="container">
        <section id="author">
            <h1 class="author-title">Naredla Rama Chandra</h1>
            <div class="content-wrap">
                <img src="author.jpg" class="author-img" alt="Chandra">
                <div style="flex: 1; font-size: 1.2rem;">
                    <p>Independent researcher and author specializing in the integration of ancient Indian knowledge systems with modern neuroscience. Architect of the <strong>Master Consciousness Protocol (MCP)</strong>.</p>
                </div>
            </div>
        </section>

        <div id="karana-display"></div>
    </div>

    <script>
        const data = [
            { id: "K1", name: "TALAPUSHPAPUTA", sa: "तलपुष्पपुट", meaning: "Flower hands on head.", pose: "Vertical alignment, thoracic resonance.", phil: "Baseline for neuro-plasticity.", neuro: "Stabilizes Vagus nerve & cognitive coherence.", benefit: "Improves balance and composure.", chakra: "SRI CHAKRA - 1st AVARANA" },
            { id: "K2", name: "LINA", sa: "लीन", meaning: "Internal absorption.", pose: "Folding inward, internal observation.", phil: "Unity of self with cosmos.", neuro: "Regulates CSF pressure & metabolic waste clearance.", benefit: "Prevents mental fatigue.", chakra: "SRI CHAKRA - 1st AVARANA" },
            { id: "K3", name: "VARTITA", sa: "वर्तित", meaning: "Dynamic rotation.", pose: "Pivoting on foot, fluid spine.", phil: "Mirrors orbital mechanics.", neuro: "Engages motor cortex for re-mapping skills.", benefit: "Enhances spatial intelligence.", chakra: "SRI CHAKRA - 1st AVARANA" },
            { id: "K4", name: "VALITA", sa: "वलित", meaning: "Bio-Acoustic Gateway.", pose: "Throat open, arm arc.", phil: "Resonance of Beeja Akshara.", neuro: "Stimulates laryngeal nerve; HRV improvement.", benefit: "Respiratory and vocal therapy.", chakra: "SRI CHAKRA - 1st AVARANA" },
            { id: "K5", name: "NIVRITTA", sa: "निवृत्त", meaning: "Cognitive Damping.", pose: "Inward arms, half-closed eyes.", phil: "Journey back to source.", neuro: "Induces high-alpha brainwaves.", benefit: "Anxiety management.", chakra: "SRI CHAKRA - 2nd AVARANA" },
            { id: "K6", name: "NIKUTTITA", sa: "निकुट्टित", meaning: "Immune Resonance.", pose: "Rhythmic stamping, swinging arms.", phil: "Grounding the physical body.", neuro: "Mechanical pump for lymphatic drainage.", benefit: "Immune system boost.", chakra: "SRI CHAKRA - 2nd AVARANA" },
            { id: "K7", name: "ARDHA-NIKUTTITA", sa: "अर्धनिकुट्टित", meaning: "Neural Duality.", pose: "Half stamp, opposite arm raised.", phil: "Balancing Ardhanarishvara energies.", neuro: "Engages Corpus Callosum for hemispheric sync.", benefit: "Creative problem solving.", chakra: "SRI CHAKRA - 2nd AVARANA" },
            { id: "K8", name: "RECITA", sa: "रेचित", meaning: "Expansion Protocol.", pose: "Arms wide, chest open.", phil: "Soul expansion into Akasha.", neuro: "Peripheral nerve sensitivity increase.", benefit: "High-performance recovery.", chakra: "SRI CHAKRA - 3rd AVARANA" },
            { id: "K9", name: "KATIHASTA", sa: "कटिहस्त", meaning: "Core Integrity.", pose: "Hands at waist, grounded stance.", phil: "Seat of stability.", neuro: "Stabilizes pelvic floor & lumbar nerves.", benefit: "Neurological signal clarity.", chakra: "SRI CHAKRA - 3rd AVARANA" },
            { id: "K10", name: "PAKSHAVANCHITA", sa: "पक्षवञ्चित", meaning: "Vestibular Ascent.", pose: "Wings spread, one leg lifted.", phil: "Symbolizing flight toward Moksha.", neuro: "Challenges vestibular coordination.", benefit: "Prevents neurological decline.", chakra: "SRI CHAKRA - 3rd AVARANA" }
        ];

        const container = document.getElementById('karana-display');

        data.forEach(k => {
            container.innerHTML += `
                <div class="karana-card" id="${k.id}">
                    <div class="left-panel">
                        <div class="label">Meaning</div><p class="panel-text">${k.meaning}</p>
                        <div class="label">Pose</div><p class="panel-text">${k.pose}</p>
                        <div class="label">Philosophy</div><p class="panel-text">${k.phil}</p>
                    </div>
                    <div class="center-panel">
                        <div class="karana-num-big">${k.id}</div>
                        <h2 style="color:var(--gold); font-family:'Cinzel'; margin-bottom:20px;">${k.name}</h2>
                        <img src="karana${k.id.substring(1)}.jpg" class="karana-image" onerror="this.src='https://via.placeholder.com/300x400?text=Karana+Image'">
                        <div style="margin-top:20px; color:var(--gold); letter-spacing:3px;">${k.chakra}</div>
                    </div>
                    <div class="right-panel">
                        <div class="label">Neuroscience</div>
                        <div class="neuro-box">🧠</div>
                        <p class="panel-text">${k.neuro}</p>
                        <div class="label">Benefit</div>
                        <p class="panel-text">${k.benefit}</p>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>

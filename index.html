<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry | Master Consciousness Protocol</title>
    <style>
        /* 1. Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff; /* Clean white base */
            overflow-x: hidden;
        }

        /* 2. Background Watermark Integration */
        .page-wrapper {
            min-height: 100vh;
            width: 100%;
            position: relative;
            /* Using your repository file background.png */
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Subtle overlay to ensure text readability against background.png */
        .page-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85); /* Not so dark, not so light */
            z-index: 1;
        }

        .content-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* 3. Logo Integration */
        .logo-center {
            margin-bottom: 40px;
        }

        .logo-center img {
            width: 150px; /* Balanced size */
            height: auto;
            border: none;
        }

        /* 4. Bold Typography & Form Elements */
        h1 {
            color: #1a2a40; /* Navy Blue */
            font-weight: 800; /* Extra Bold */
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #d4af37; /* Gold */
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        form {
            text-align: left;
            padding: 20px;
        }

        .field-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 700; /* Bold and readable */
            color: #1a2a40;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        input, select, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #d4af37;
            padding: 12px 5px;
            font-size: 1.05rem;
            color: #1a2a40;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea {
            border: 2px solid #d4af37;
            border-radius: 4px;
            margin-top: 10px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1a2a40;
        }

        /* 5. Submit Button */
        .submit-btn {
            background-color: #1a2a40;
            color: #d4af37;
            border: none;
            padding: 18px 45px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            border-radius: 2px;
        }

        .submit-btn:hover {
            background-color: #d4af37;
            color: #1a2a40;
            transform: translateY(-2px);
        }

        /* Styling the Select Dropdown options */
        option {
            background-color: #ffffff;
            color: #1a2a40;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .logo-center img { width: 120px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="content-container">
            
            <div class="logo-center">
                <img src="logo.jpg" alt="Aesthetics of Society Logo">
            </div>

            <h1>Let the light deep within illumine</h1>
            <p class="subtitle">Show everyone your light.</p>

            <form id="enquiryForm" onsubmit="handleInquiry(event)">
                
                <div class="field-group">
                    <label for="name">Full Name / Academic Institution</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>

                <div class="field-group">
                    <label for="topic">Research Domain of Inquiry</label>
                    <select id="topic" required>
                        <option value="" disabled selected>Select a Research Area...</option>
                        <optgroup label="Core Research">
                            <option>Master Consciousness Protocol (MCP)</option>
                            <option>108 Karanas - Bio-Mechanical Coding</option>
                            <option>Mudra Science - Neural Activation</option>
                        </optgroup>
                        <optgroup label="Bio-Acoustics">
                            <option>Sapta Swaras - Bio-Acoustic Foundations</option>
                            <option>Beeja Aksharas - Cranial Resonance</option>
                            <option>Shabda Brahman - The Science of Sound</option>
                        </optgroup>
                        <optgroup label="Modern Synthesis">
                            <option>Sanskrit in Artificial Intelligence</option>
                            <option>Neuroscience & Vedic Epigenetics</option>
                            <option>Astrophysical Constants (Ritam)</option>
                        </optgroup>
                        <optgroup label="Collaboration">
                            <option>Scholarly Consortium Membership</option>
                            <option>Publication / Author Inquiry</option>
                        </optgroup>
                    </select>
                </div>

                <div class="field-group">
                    <label for="message">Detailed Inquiry / Proposal</label>
                    <textarea id="message" rows="5" required placeholder="Please provide details of your research inquiry..."></textarea>
                </div>

                <div style="text-align: center;">
                    <button type="submit" class="submit-btn">SEND INQUIRY</button>
                </div>

            </form>
        </div>
    </div>

    <script>
        function handleInquiry(event) {
            event.preventDefault();

            // 1. Capture Data
            const name = document.getElementById('name').value;
            const topic = document.getElementById('topic').value;
            const message = document.getElementById('message').value;

            // 2. Validation
            if (!name || !topic || !message) {
                alert("Protocol Error: All fields must be completed to ensure academic alignment.");
                return;
            }

            // 3. Zen Confirmation
            alert("Equanimity (Samatva) achieved. Your data is being routed to smith123846@gmail.com.");

            // 4. Construct Email
            const subject = encodeURIComponent(`Research Inquiry: ${topic}`);
            const body = encodeURIComponent(
                `Researcher/User: ${name}\n` +
                `Selected Topic: ${topic}\n\n` +
                `Inquiry Details:\n${message}\n\n` +
                `--- End of Scientific Inquiry ---`
            );

            // 5. Trigger Mail Client
            window.location.href = `mailto:smith123846@gmail.com?subject=${subject}&body=${body}`;
        }
    </script>

</body>

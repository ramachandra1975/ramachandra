<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Montserrat:wght@300;400;600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f1ec;
            overflow-x: hidden;
        }

        /* 1. BACKGROUND WITH LIGHT RADIANCE */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(244,241,236,0.5));
            z-index: 1;
        }

        /* 2. TOP NAVIGATION BAR (MATCHING IMAGE 3) */
        header {
            position: absolute;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            box-sizing: border-box;
            z-index: 100;
        }

        .brand-corner { display: flex; align-items: center; gap: 15px; }
        .logo-small { width: 55px; mix-blend-mode: multiply; opacity: 0.9; }
        .brand-text h1 { font-size: 1rem; margin: 0; letter-spacing: 2px; color: #1a304d; text-transform: uppercase; font-weight: 600; }
        .brand-text p { margin: 0; font-size: 0.7rem; color: #b39356; letter-spacing: 1.5px; }

        nav { display: flex; align-items: center; gap: 30px; }
        nav a { text-decoration: none; color: #1a304d; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
        
        /* The gold Introduction box from your image */
        .btn-intro { 
            border: 1px solid #b39356; 
            padding: 10px 25px; 
            color: #b39356 !important; 
            transition: 0.3s;
        }
        .btn-intro:hover { background: #b39356; color: white !important; }

        /* 3. CENTRAL CONTENT & SCRIPT WATERMARK */
        .center-wrap {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* The flowing white script behind the text */
        .script-watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Brush Script MT', cursive;
            font-size: 10rem;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            z-index: -1;
            pointer-events: none;
        }

        .est-text { font-size: 0.75rem; letter-spacing: 5px; color: #b39356; text-transform: uppercase; margin-bottom: 12px; font-weight: 600; }
        
        .main-title { font-family: 'Playfair Display', serif; font-size: clamp(4rem, 10vw, 7rem); line-height: 0.85; margin: 0; }
        .navy { color: #1a304d; }
        .gold { color: #d4af37; font-style: italic; display: block; }

        .mission { font-size: 0.85rem; letter-spacing: 4px; color: #4a5a71; text-transform: uppercase; margin-top: 40px; line-height: 1.8; font-weight: 600; }

        /* 4. BUTTON GROUP (FLAT BOX STYLE) */
        .btn-group { display: flex; margin-top: 50px; justify-content: center; }
        
        .hero-btn {
            padding: 24px 55px;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            min-width: 220px;
            box-sizing: border-box;
        }
        .btn-filled { background: #1a304d; color: white; border: 1px solid #1a304d; }
        .btn-ghost { background: rgba(255,255,255,0.4); color: #1a304d; border: 1px solid rgba(0,0,0,0.1); backdrop-filter: blur(4px); }

    </style>
</head>

    <div

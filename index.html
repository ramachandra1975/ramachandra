<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Researcher</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
            overflow: hidden;
        }

        /* 1. BACKGROUND */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle warm tint to the whole screen */
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2); 
            z-index: 1;
        }

        /* 2. THE LOGO WATERMARK - LIGHT & ETCHED */
        .central-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; /* Even smaller size */
            opacity: 0.4; /* Higher opacity so it's visible */
            z-index: 2;
            /* Screen/Overlay makes it look like a light watermark on the sky */
            mix-blend-mode: soft-light; 
            filter: grayscale(100%) brightness(1.2);
            pointer-events: none;
        }

        /* 3. NAVIGATION */
        header {
            position: absolute;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 12px 35px;
            box-sizing: border-box;
            z-index: 100;
        }

        .nav-logo {
            width: 25px;
            mix-blend-mode: multiply;
            opacity: 0.5;
        }

        nav a {
            text-decoration: none;
            color: #0d1b2e;
            margin-left: 12px;
            font-size: 0.6rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 4. TEXT WATERMARK - LIGHT COLOURS BUT VISIBLE */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .tagline-watermark {
            font-size: 0.75rem;
            letter-spacing: 4px;
            font-weight: bold;
            text-transform: uppercase;
            /* Using a light sand/gold color */
            color: #c5a66d; 
            opacity: 0.9;
            text-shadow: 0px 1px 2px rgba(255,255,255,0.5); /* Subtle lift for visibility */
            margin-bottom: 8px;
        }

        .mission-watermark {
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.4;
            /* Using a muted slate blue (light navy) */
            color: #5c6d85;
            opacity: 0.85;
            margin-top: 12px;
        }

        /* 5. TINY RADIO BUTTONS */
        .btn-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .btn {
            padding: 5px 15px; /* Extremely compact */
            text-decoration: none;
            font-size: 0.6rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 30px; /* Full radio pill shape */
            transition: 0.3s;
        }

        .btn-navy { 
            background: #0d1b2e; 
            color: #fff; 
            border: 1px solid #0d1b2e;
        }
        
        .btn-outline { 
            background: transparent; 
            color: #0d1b2e; 
            border: 1px solid #0d1b2e;
        }

    </style>
</head>
<body>

    <section class="hero">
        
        <!-- Light Logo Watermark -->
        <img src="logo.jpg" class="central-watermark" alt="">

        <header>
            <img src="logo.jpg" class="nav-logo" alt="">
            <nav>
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="content">
            <!-- Light but Visible Text Watermarks -->
            <div class="tagline-watermark">
                Independent Researcher & Author
            </div>
            
            <div class="mission-watermark">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <!-- Tiny Radio Pill Buttons -->
            <div class="btn-container">
                <a href="#" class="btn btn-navy">Publications</a>
                <a href="#" class="btn btn-outline">The Author</a>
            </div>
        </div>

    </section>

</body>
</html>

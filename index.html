<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society | Naredla Rama Chandra</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a059;
            --glass: rgba(255, 255, 255, 0.9);
            --dark: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: var(--dark);
            /* Original Background: More visible manuscript */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://img.rocket.new/generatedImages/rocket_gen_img_1e93f7ba1-1765676387903.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 3.5rem;
            border-radius: 20px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.4);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 2rem;
            display: block;
        }

        .options-container {
            display: grid;
            gap: 15px;
            margin-top: 2.5rem;
        }

        /* The Original Radio Button Style */
        .nav-option {
            display: flex;
            align-items: center;
            background: white;
            padding: 18px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .nav-option:hover {
            transform: translateY(-3px);
            border-color: #d62828; /* The red you liked */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .radio-circle {
            height: 22px;
            width: 22px;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin-right: 18px;
            position: relative;
        }

        .nav-option:hover .radio-circle {
            border-color: #d62828;
        }

        .nav-option:hover .radio-circle::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 14px;
            height: 14px;
            background: #d62828;
            border-radius: 50%;
        }

        .option-text {
            font-weight: 600;
            font-size: 1.15rem;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #444;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <span class="subtitle">Independent Researcher & Author</span>
        <h1>Aesthetics of Society</h1>
        <p class="description">Bridging Ancient Indian Systems (Sapta Swaras & 108 Karanas) with Modern Neuroscience & Bio-acoustics.</p>

        <div class="options-container">
            <a href="/publications" class="nav-option">
                <div class="radio-circle"></div>
                <span class="option-text">Complete Science of Consciousness</span>
            </a>
            <a href="/protocol" class="nav-option">
                <div class="radio-circle"></div>
                <span class="option-text">Master Consciousness Protocol</span>
            </a>
        </div>
    </div>

</body>
</html>

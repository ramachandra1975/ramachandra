<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* Using background.png as the primary background */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            text-align: center;
        }

        /* Navigation */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            box-sizing: border-box;
            z-index: 10;
        }

        .brand h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin: 0;
            color: #1a365d;
            text-transform: uppercase;
        }

        .brand p {
            margin: 0;
            font-size: 0.9rem;
            color: #c5a059;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a365d;
            margin-left: 25px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Center Content - Rectifying the overlap */
        .hero-content {
            position: relative;
            z-index: 5; /* Ensures title sits above the background script */
            padding: 20px;
        }

        .tagline {
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #c5a059;
            margin-bottom: 10px;
        }

        .main-title {
            font-size: clamp(3rem, 10vw, 5rem);
            margin: 0;
            line-height: 1;
        }

        .main-title .navy { color: #1a365d; }
        .main-title .gold { color: #c5a059; font-style: italic; }

        .mission {
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 25px;
            color: #1a365d;
            font-weight: bold;
        }

        /* Buttons */
        .btn-container {
            margin-top: 40px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 15px 35px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }

        .btn-navy { background: #1a365d; color: white; }
        .btn-clear { background: rgba(255,255,255,0.7); color: #333; border: 1px solid #ccc; }

        /* RECTIFICATION: All Sidebar divs and related code (Vedic/Karanas) are removed */
    </style>
</head>
<body>

    <section class="hero-section">
        <nav>
            <div class="brand">
                <h1>Aesthetics of Society</h1>
                <p>culturalmusings.com</p>
            </div>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#publications">Publications</a>
                <a href="#timeline">Timeline</a>
                <a href="#media">Media</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>

        <div class="hero-content">
            <div class="tagline">Independent Researcher & Author</div>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <div class="mission">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="btn-container">
                <a href="#publications" class="btn btn-navy">Explore Publications</a>
                <a href="#about" class="btn btn-clear">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>

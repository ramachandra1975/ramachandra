
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
            overflow: hidden;
        }

        /* 1. BACKGROUND */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Softens background.png */
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); 
            z-index: 1;
        }

        /* 2. CENTRAL LOGO WATERMARK */
        .central-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px; /* Large enough to be seen */
            opacity: 0.25; /* "Not so dark, not so light" */
            z-index: 2; /* Sits behind text, above background */
            mix-blend-mode: multiply; /* Removes the white box from logo.jpg */
            pointer-events: none;
        }

        /* 3. HEADER */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            box-sizing: border-box;
            z-index: 100;
        }

        .branding {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-nav {
            width: 50px;
            mix-blend-mode: multiply;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 2px;
            color: #0d1b2e;
            text-transform: uppercase;
        }

        .brand-text p {
            margin: 0;
            font-size: 0.8rem;
            color: #8a6d2f;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #0d1b2e;
            margin-left: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 4. MAIN CONTENT */
        .content {
            position: relative;
            z-index: 10; /* Ensures text is on top of watermark */
            text-align: center;
        }

        .tagline {
            font-size: 0.9rem;
            letter-spacing: 5px;
            color: #8a6d2f; 
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            line-height: 1;
            margin: 0;
        }

        .navy { color: #0d1b2e; }
        .gold { color: #8a6d2f; font-style: italic; }

        .mission {
            font-size: 1rem;
            font-weight: 900;
            color: #0d1b2e;
            text-transform: uppercase;
            margin-top: 40px;
            letter-spacing: 1.5px;
            line-height: 1.6;
        }

        /* 5. BUTTONS */
        .btn-wrap {
            margin-top: 45px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 18px 40px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-navy { background: #0d1b2e; color: white; }
        .btn-beige { background: #e0d9cf; color: #111; border: 1px solid #bbb; }
    </style>
</head>
<body>

    <section class="hero">
        <!-- LOGO IN CENTRE AS WATERMARK -->
        <img src="logo.jpg" class="central-watermark" alt="">

        <header>
            <div class="branding">
                <img src="logo.jpg" class="logo-nav" alt="">
                <div class="brand-text">
                    <h1>Aesthetics of Society</h1>
                    <p>culturalmusings.com</p>
                </div>
            </div>
            <nav>
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="content">
            <p class="tagline">Independent Researcher & Author</p>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <div class="mission">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="btn-wrap">
                <a href="#" class="btn btn-navy">Explore Publications</a>
                <a href="#" class="btn btn-beige">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>

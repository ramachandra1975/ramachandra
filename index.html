<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society | Naredla Rama Chandra</title>
    <style>
        :root {
            --primary: #1a365d; 
            --accent: #d4af37;
            /* CRITICAL: Ensure these filenames match your GitHub exactly */
            --bg-file: url('background_image.png.jpg');
            --logo-file: url('logo.jpg');
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* 1. THE FULL BACKGROUND IMAGE */
        .main-wrapper {
            position: relative;
            min-height: 100vh;
            width: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), var(--bg-file);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
        }

        /* 2. THE CENTERED LOGO WATERMARK */
        .main-wrapper::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; 
            height: 500px;
            background-image: var(--logo-file);
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.15; /* "Decent" visibility - clearly viewed */
            z-index: 1;
            pointer-events: none;
        }

        .serif { font-family: 'Georgia', serif; }

        /* HEADER WITH FITTED LOGO TOP-LEFT */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .brand-container { display: flex; align-items: center; gap: 12px; }
        
        .header-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .brand-text h1 { 
            font-size: 1.2rem; 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--primary);
        }

        nav a { 
            text-decoration: none; 
            color: var(--primary); 
            font-size: 10px; 
            font-weight: bold; 
            text-transform: uppercase; 
            margin-left: 20px; 
        }

        /* HERO CONTENT & BUTTONS */
        .hero-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 5;
            padding: 20px;
        }

        .main-title { 
            font-size: 5rem; 
            margin: 0; 
            color: var(--primary);
            font-weight: normal;
        }
        .main-title span { color: var(--accent); font-style: italic; }

        /* THE TWO BUTTONS */
        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 50px;
        }

        .action-btn {
            padding: 18px 40px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .btn-dark { background: var(--primary); color: white; }
        .btn-light { background: rgba(255,255,255,0.8); color: var(--primary); }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

    </style>
</head>
<body>

<div class="main-wrapper">
    <header>
        <div class="brand-container">
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <div class="brand-text">
                <h1 class="serif">Aesthetics of Society</h1>
            </div>
        </div>
        <nav>
            <a href="#">About</a>
            <a href="#">Publications</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="hero-content">
        <h2 class="main-title serif">Aesthetics <span>of Society</span></h2>
        <p style="letter-spacing: 4px; text-transform: uppercase; font-size: 11px; color: var(--primary); margin-top: 15px;">
            Naredla Rama Chandra — Independent Researcher
        </p>

        <div class="button-group">
            <button class="action-btn btn-dark">Explore Publications</button>
            <button class="action-btn btn-light">About the Author</button>
        </div>
    </main>
</div>

</body>
</html>

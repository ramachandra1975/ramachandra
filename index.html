<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetics of Society</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
        }

        /* 1. MAIN HERO & BACKGROUND */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The Mask: Softens background.png for better text contrast */
        .hero-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.45); 
            z-index: 1;
        }

        /* 2. THE WATERMARK (Centered logo.jpg) */
        .logo-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; /* Adjust size as needed */
            opacity: 0.12; /* Controls the subtlety of the watermark */
            z-index: 2;
            pointer-events: none;
        }

        /* 3. HEADER: LOGO & BRANDING */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            box-sizing: border-box;
            z-index: 100;
        }

        .branding {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-top-left {
            width: 50px;
            height: auto;
            display: block;
        }

        .branding-text h1 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 2px;
            color: #1a365d;
            text-transform: uppercase;
        }

        .branding-text p {
            margin: 0;
            font-size: 0.8rem;
            color: #c5a059;
        }

        .navigation a {
            text-decoration: none;
            color: #1a365d;
            margin-left: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 4. MAIN CONTENT */
        .main-content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        .main-title {
            font-size: clamp(3rem, 10vw, 5.5rem);
            line-height: 0.9;
            margin: 0;
        }

        .navy { color: #1a365d; }
        .gold { color: #c5a059; font-style: italic; }

        .mission-line {
            font-size: 0.9rem;
            font-weight: bold;
            color: #1a365d;
            text-transform: uppercase;
            margin-top: 30px;
            line-height: 1.5;
            letter-spacing: 1px;
        }

        /* 5. CTA BUTTONS */
        .btn-group {
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 18px 40px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-primary { background: #1a365d; color: white; }
        .btn-secondary { background: #e6e1d7; color: #333; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- Logo as Watermark -->
        <img src="logo.jpg" class="logo-watermark" alt="">

        <header>
            <div class="branding">
                <img src="logo.jpg" class="logo-top-left" alt="Aesthetics of Society Logo">
                <div class="branding-text">
                    <h1>Aesthetics of Society</h1>
                    <p>culturalmusings.com</p>
                </div>
            </div>
            <div class="navigation">
                <a href="#">About</a>
                <a href="#">Publications</a>
                <a href="#">Timeline</a>
                <a href="#">Media</a>
                <a href="#">Contact</a>
            </div>
        </header>

        <div class="main-content">
            <p style="letter-spacing: 4px; color: #c5a059; text-transform: uppercase; margin-bottom: 5px;">Independent Researcher & Author</p>
            
            <h1 class="main-title">
                <span class="navy">Aesthetics</span><br>
                <span class="gold">of Society</span>
            </h1>

            <div class="mission-line">
                Bridging Ancient Indian Systems with Modern<br>
                Neuroscience & Bio-Acoustics
            </div>

            <div class="btn-group">
                <a href="#" class="btn btn-primary">Explore Publications</a>
                <a href="#" class="btn btn-secondary">About the Author</a>
            </div>
        </div>
    </section>

</body>
</html>
